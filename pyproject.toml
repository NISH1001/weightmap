[project]
name = "weightmap"
version = "0.1.0"
description = "Training-free maps between a large and a small language model's representations"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "torch>=2.15.0",
    "transformers>=5.22.1",
]

[project.optional-dependencies]
# only needed for scripts/ (the one-off experiment pipelines and figures)
experiments = [
    "accelerate>=1.15.0",
    "datasets>=5.1.0",
    "math-verify>=0.9.0",
    "matplotlib>=3.11.2",
    "scikit-learn>=1.9.1",
]

[dependency-groups]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weightmap"]

[tool.pytest.ini_options]
testpaths = ["tests"]
